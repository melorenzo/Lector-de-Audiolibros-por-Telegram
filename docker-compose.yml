services:
  audiobook-bot:
    build: .
    container_name: audiobook-bot

    env_file:
      - .env

    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      - ./app/storage/books:/app/app/storage/books
      - ./app/storage/audio:/app/app/storage/audio

    restart: unless-stopped